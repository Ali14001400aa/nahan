name = "nahan-gateway"
main = "worker.js"
compatibility_date = "2024-03-01"
compatibility_flags = ["nodejs_compat"]

# D1 Database binding for persistent configuration, users, usage tracking, and relay health
[[d1_databases]]
binding = "IOT_DB"
database_name = "nahan-db"
database_id = "YOUR_D1_DATABASE_ID_HERE"

# Optional environment variables
[vars]
# DASHBOARD_URL = "https://raw.githubusercontent.com/itsyebekhe/nahan/main/dashboard.html"
# SUBSCRIPTION_URL = "https://raw.githubusercontent.com/itsyebekhe/nahan/main/subscription.html"
